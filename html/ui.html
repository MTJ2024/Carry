<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="styles.css" type="text/css">
</head>
<body>
	<div class="full-screen">
		<div class="carrytype-container" id="carrytype">
			<div class="header">
				<h1 class="CarryTypeMenuHeaderText">CARRY MENU</h1>
				<button type="button" class="btnQuit closetypemenu" aria-label="Close">&times;</button>
			</div>
			<div class="cards">
				<div class="card carrytype1">
					<div class="card-icon">
						<img src="img/carrytype1.png" alt="Carry 1">
					</div>
					<div class="carrytextmain">CARRY</div>
					<div class="card-desc">Fireman's carry over shoulder</div>
					<button type="button" class="card-btn carry1select">Select</button>
				</div>
				<div class="card carrytype2">
					<div class="card-icon">
						<img src="img/carrytype2.png" alt="Carry 2">
					</div>
					<div class="carrytextmain">ARM SITBACK</div>
					<div class="card-desc">Carry in arms</div>
					<button type="button" class="card-btn carry2select">Select</button>
				</div>
				<div class="card carrytype3">
					<div class="card-icon">
						<img src="img/carrytype3.png" alt="Carry 3">
					</div>
					<div class="carrytextmain">PIGGYBACK</div>
					<div class="card-desc">Piggyback ride</div>
					<button type="button" class="card-btn carry3select">Select</button>
				</div>
			</div>
		</div>
	</div>
	<script src="scripts.js" type="text/javascript"></script>
	<script src="debounce.min.js" type="text/javascript"></script>
</body>
</html>
