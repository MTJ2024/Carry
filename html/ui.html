<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="styles.css" type="text/css">
</head>
<body>
	<div class="mtj-overlay">
		<div class="mtj-panel" id="carrytype" style="display:none">
			<div class="mtj-panel-head">
				<span class="mtj-panel-title">TRAGEN</span>
				<button type="button" class="mtj-close closetypemenu" aria-label="Schliessen">&times;</button>
			</div>
			<div class="mtj-grid">
				<div class="mtj-tile">
					<div class="mtj-tile-img">
						<img src="img/carrytype1.png" alt="Schulter">
					</div>
					<div class="mtj-tile-name">SCHULTER</div>
					<div class="mtj-tile-desc">Feuerwehrgriff ueber die Schulter</div>
					<button type="button" class="mtj-tile-btn carry1select">Auswaehlen</button>
				</div>
				<div class="mtj-tile">
					<div class="mtj-tile-img">
						<img src="img/carrytype2.png" alt="Arm">
					</div>
					<div class="mtj-tile-name">AUF DEM ARM</div>
					<div class="mtj-tile-desc">Auf den Armen tragen</div>
					<button type="button" class="mtj-tile-btn carry2select">Auswaehlen</button>
				</div>
				<div class="mtj-tile">
					<div class="mtj-tile-img">
						<img src="img/carrytype3.png" alt="Huckepack">
					</div>
					<div class="mtj-tile-name">HUCKEPACK</div>
					<div class="mtj-tile-desc">Huckepack tragen</div>
					<button type="button" class="mtj-tile-btn carry3select">Auswaehlen</button>
				</div>
			</div>
		</div>
	</div>

	<!-- Trage-Anfrage annehmen/ablehnen (kein Cursor noetig) -->
	<div class="mtj-request" id="carryrequest" style="display:none">
		<div class="mtj-request-bell">&#128276;</div>
		<div class="mtj-request-heading">TRAGE-ANFRAGE</div>
		<div class="mtj-request-msg">Jemand moechte dich tragen!</div>
		<div class="mtj-request-keys">
			<div class="mtj-key mtj-key-yes"><span class="mtj-keycap">E</span> Annehmen</div>
			<div class="mtj-key mtj-key-no"><span class="mtj-keycap">X</span> Ablehnen</div>
		</div>
	</div>

	<!-- Benachrichtigungen -->
	<div id="mtj-notify-box"></div>

	<script src="scripts.js" type="text/javascript"></script>
</body>
</html>
